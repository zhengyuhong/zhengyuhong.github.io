<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ description }}">
    <title>{{ title }}</title>
    <link rel="icon" href="{{ asset_prefix }}assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{ asset_prefix }}assets/style.css">
    <script defer src="{{ asset_prefix }}assets/search.js"></script>
    <link rel="stylesheet" href="{{ asset_prefix }}assets/vendor/katex/katex.min.css">
    <script>
      function initializeMermaid() {
        if (typeof mermaid === "undefined") return;
        mermaid.initialize({startOnLoad: false, theme: "default", securityLevel: "loose"});
        const render = function () {
          mermaid.run({querySelector: ".mermaid"});
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", render, {once: true});
        } else {
          render();
        }
      }
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"
      onload="initializeMermaid()"></script>
  </head>
  <body class="{{ body_class }}">
    <header class="site-header">
      <a class="site-title" href="{{ asset_prefix }}index.html">{{ site_name }}</a>
      <nav aria-label="Primary navigation">
        <a href="{{ asset_prefix }}index.html">首页</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>这里记录技术、思考和长期积累的笔记。</p>
    </footer>
    <script src="{{ asset_prefix }}assets/vendor/katex/katex.min.js"></script>
    <script src="{{ asset_prefix }}assets/vendor/katex/auto-render.min.js"></script>
    <script>
      if (typeof renderMathInElement === "function") {
        renderMathInElement(document.body, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "\\(", right: "\\)", display: false},
            {left: "\\[", right: "\\]", display: true},
            {left: "$", right: "$", display: false}
          ]
        });
      }
    </script>
  </body>
</html>
